<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>XC Station Reference Guide</title>

<meta name="theme-color" content="#A50034">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f2740;
    color:white;
}

.header{
    background:#A50034;
    padding:20px;
    text-align:center;
    font-size:30px;
    font-weight:bold;
}

.search-container{
    background:white;
    padding:15px;
}

.search-box{
    width:100%;
    box-sizing:border-box;
    padding:15px;
    font-size:18px;
    border-radius:12px;
    border:3px solid #f2b705;
}

.content{
    padding:15px;
}

.card{
    background:white;
    color:black;
    border-radius:12px;
    margin-bottom:15px;
    overflow:hidden;
}

.card-header{
    background:#f2b705;
    padding:12px;
    font-weight:bold;
    font-size:20px;
}

.card-body{
    padding:15px;
}

.info-row{
    margin-bottom:8px;
}

.section{
    background:white;
    color:black;
    border-radius:12px;
    margin-top:10px;
}

.section summary{
    padding:15px;
    font-weight:bold;
    cursor:pointer;
}

.section-content{
    padding:15px;
}

.loading{
    text-align:center;
    padding:30px;
}

</style>
</head>

<body>

<div class="header">
XC Station Reference Guide
</div>

<div class="search-container">

<input
class="search-box"
id="search"
placeholder="Enter CRS Code (e.g. YRK, NCL, BHM)"
maxlength="3">

</div>

<div class="content">

<div id="result">

<div class="loading">
Enter a CRS code to search
</div>

</div>

</div>

<script>

const API_BASE =
"https://xcstationsapp.robhinds-crosscountry.workers.dev/api/station/";

async function searchStation(crs){

    document.getElementById("result").innerHTML =
    "<div class='loading'>Loading station information...</div>";

    try{

        const response =
        await fetch(API_BASE + crs.toUpperCase());

        const station =
        await response.json();

        renderStation(station);

    }
    catch(err){

        document.getElementById("result").innerHTML =
        "<div class='loading'>Unable to load station.</div>";

    }

}

function renderStation(station){

const html = `

<div class="card">

<div class="card-header">
${station.name}
(${station.crsCode})
</div>

<div class="card-body">

<div class="info-row">
<b>Operator:</b>
${station.stationOperator?.name ?? "Unknown"}
</div>

<div class="info-row">
<b>NLC:</b>
${station.nationalLocationCode}
</div>

<div class="info-row">
<b>Address:</b>
${station.address?.addressLine1 ?? ""}
<br>
${station.address?.addressLine2 ?? ""}
<br>
${station.address?.postcode ?? ""}
</div>

<div class="info-row">
<b>Staffing:</b>
${station.staffingLevel ?? "Unknown"}
</div>

</div>

</div>

<details class="section">

<summary>Accessibility</summary>

<div class="section-content">

<b>Step Free:</b>

${station.stationAccessibility?.stepFreeCategory?.category ?? "Unknown"}

<br><br>

<b>Wheelchairs Available:</b>

${station.stationAccessibility?.wheelchairsAvailable ? "Yes" : "No"}

<br><br>

<b>Lifts:</b>

${station.lifts?.available ? "Available" : "No"}

</div>

</details>

<details class="section">

<summary>Facilities</summary>

<div class="section-content">

Toilets:
${station.toiletsAndChanging?.toilets?.available ? "Yes" : "No"}

<br>

Waiting Room:
${station.loungesAndWaiting?.waitingFacility?.available ? "Yes" : "No"}

<br>

WiFi:
${station.stationFacilities?.wifi?.available ? "Yes" : "No"}

<br>

Shops:
${station.stationFacilities?.shops?.available ? "Yes" : "No"}

<br>

Refreshments:
${station.stationFacilities?.refreshments?.available ? "Yes" : "No"}

</div>

</details>

<details class="section">

<summary>Transport Links</summary>

<div class="section-content">

Taxi:
${station.transportLinks?.taxi?.available ? "Yes" : "No"}

<br>

Bus:
${station.transportLinks?.bus?.available ? "Yes" : "No"}

<br>

Rail Replacement:
${station.transportLinks?.replacementBus?.available ? "Yes" : "No"}

</div>

</details>

<details class="section">

<summary>Ticket Office</summary>

<div class="section-content">

Ticket Office:
${station.ticketBuying?.ticketOffice?.available ? "Yes" : "No"}

<br>

Ticket Machines:
${station.ticketBuying?.ticketMachinesAvailable ? "Yes" : "No"}

</div>

</details>

`;

document.getElementById("result").innerHTML = html;

}

document
.getElementById("search")
.addEventListener("keyup",(e)=>{

    if(e.target.value.length===3){

        searchStation(e.target.value);

    }

});

</script>

</body>
</html>
