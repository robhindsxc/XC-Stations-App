<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XC Station Reference Guide</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#A50034">
<style>
body{margin:0;font-family:Arial;background:#0f2740;color:#fff}
.header{background:#A50034;padding:18px;text-align:center;font-size:28px;font-weight:bold}
.search{padding:12px;background:#fff}
.search input{width:100%;padding:14px;border-radius:12px;border:2px solid #f2b705}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;padding:12px}
.card{background:#fff;color:#000;padding:12px;border-radius:12px;border-left:8px solid #f2b705}
.crs{color:#A50034;font-weight:bold}
</style>
</head>
<body>
<div class="header">XC Station Reference Guide</div>
<div class="search">
<input id="q" placeholder="Search station name or CRS code">
</div>
<div class="grid" id="results"></div>
<script>
let stations=[];
fetch('stations.json').then(r=>r.json()).then(data=>{
stations=data;render('');
});
function render(f){
const box=document.getElementById('results');
box.innerHTML='';
stations.filter(s=>(s.name+' '+s.crs).toLowerCase().includes(f.toLowerCase()))
.forEach(s=>{
box.innerHTML += `<div class="card">
<h3>${s.name}</h3>
<div class="crs">CRS: ${s.crs}</div>
<div>Operator: ${s.operator}</div>
<div>Ready for Knowledgebase feed import</div>
</div>`;
});
}
document.getElementById('q').addEventListener('input',e=>render(e.target.value));
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
